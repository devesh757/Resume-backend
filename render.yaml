services:
  - type: web
    name: resume-builder-api
    runtime: node
    plan: free
    buildCommand: npm install && npx puppeteer browsers install chrome && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
